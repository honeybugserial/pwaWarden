; pwaWarden - advanced.ini
; -----------------------------------------------------------------------
; This file allows you to override pwaWarden's default behavior.
; Copy this file as advanced.ini to the same folder as pwaWarden.exe to use.
;
; All settings default to false and do not need to be listed here unless
; you want to change them. Lines starting with ; are comments and are ignored.
;
; Accepted values for any key: true / false / 1 / 0 / yes / no
; -----------------------------------------------------------------------


; Allow more than one copy of pwaWarden to run at the same time.
; WARNING: multiple instances will conflict over tray icons and process
; tracking, and may cause unpredictable behavior.
; Default: false
allowMultiplePwaWardenInstances = false


; Allow launching a PWA even if one is already running.
; WARNING: this will result in duplicate Chrome processes for the same PWA
; and is very likely to cause stuck background processes.
; Default: false
allowMultiplePWAInstances = false


; Allow editing a PWA's settings while it is currently running.
; WARNING: any changes made will not take effect until the PWA is
; closed and relaunched manually.
; Default: false
allowSettingsWhileRunning = false
